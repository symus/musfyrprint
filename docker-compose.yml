# Local full stack: `cp .env.example .env` (adjust), then `docker compose up --build`.
# Storefront http://localhost:3000 · API http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musfyr}
      POSTGRES_USER: ${POSTGRES_USER:-musfyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musfyr}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-musfyr}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # "dev" loads demo seed data and the development admin; use "prod" for real deployments.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-musfyr}
      DB_USERNAME: ${POSTGRES_USER:-musfyr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-musfyr}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MANAGEMENT_PORT: 8081
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-musfyr print}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on: [backend]
    environment:
      API_INTERNAL_URL: http://backend:8080
    ports: ["3000:3000"]

volumes:
  pgdata:
