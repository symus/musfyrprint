spring:
  application:
    name: musfyr-print-backend
  profiles:
    default: dev
  datasource:
    # Either a full JDBC URL, or host/port/name parts (e.g. from a hosting platform's database settings).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musfyr}}
    username: ${DB_USERNAME:musfyr}
    password: ${DB_PASSWORD:musfyr}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Omitted boolean / numeric fields fall back to false / 0 instead of rejecting the request.
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.musfyr: INFO

app:
  brand:
    name: ${BRAND_NAME:Musfir Print}
    tagline: ${BRAND_TAGLINE:Create It. Wear It. Stick It.}
    support-email: ${BRAND_SUPPORT_EMAIL:hello@example.com}
    support-phone: ${BRAND_SUPPORT_PHONE:+48 000 000 000}
    address: ${BRAND_ADDRESS:Registered address to be configured}
    social:
      instagram: ${BRAND_SOCIAL_INSTAGRAM:}
      facebook: ${BRAND_SOCIAL_FACEBOOK:}
      tiktok: ${BRAND_SOCIAL_TIKTOK:}
      pinterest: ${BRAND_SOCIAL_PINTEREST:}
  commerce:
    default-currency: ${DEFAULT_CURRENCY:PLN}
    default-locale: ${DEFAULT_LOCALE:pl-PL}
    supported-currencies: ${SUPPORTED_CURRENCIES:PLN,EUR}
    supported-locales: ${SUPPORTED_LOCALES:pl-PL,en-GB}
    default-size-system: ${DEFAULT_SIZE_SYSTEM:EU}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:musfyr-print}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT2H}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    max-failed-logins: 5
    lockout-duration: PT15M
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_NAME:Store Admin}
  shop:
    public-site-url: ${PUBLIC_SITE_URL:http://localhost:3000}
    public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
    tax:
      # EXEMPT = not VAT-registered (art. 113 small-business exemption); STANDARD = prices include VAT
      mode: ${TAX_MODE:EXEMPT}
      standard-rate-percent: ${TAX_STANDARD_RATE:23}
    mail:
      from: ${MAIL_FROM:no-reply@example.com}
  payments:
    p24:
      # DISABLED | SIMULATOR (test page, no money) | SANDBOX | PRODUCTION
      mode: ${P24_MODE:DISABLED}
      merchant-id: ${P24_MERCHANT_ID:0}
      pos-id: ${P24_POS_ID:0}
      api-key: ${P24_API_KEY:}
      crc-key: ${P24_CRC_KEY:}
      notification-ips: ${P24_NOTIFICATION_IPS:}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Seed scripts are versioned V1000+, so later schema migrations (V2, V3, ...) arrive "out of order" on
    # databases that already hold seed data. Production loads no seeds and keeps strict ordering.
    out-of-order: true
app:
  security:
    # Development-only fallback. Production refuses to start without JWT_SECRET (see SecurityProperties).
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    cookie-secure: ${COOKIE_SECURE:false}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@musfyr.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe-Admin-2026!}
  payments:
    p24:
      mode: ${P24_MODE:SIMULATOR}
      merchant-id: ${P24_MERCHANT_ID:11111}
      api-key: ${P24_API_KEY:dev-simulator-api-key}
      crc-key: ${P24_CRC_KEY:dev-simulator-crc-key}

---
# "demo": production settings plus the sample catalogue, for preview deployments (e.g. prod,demo on Render).
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    out-of-order: true
app:
  payments:
    p24:
      # Demo deployments use the built-in test payment page unless real sandbox keys are configured.
      mode: ${P24_MODE:SIMULATOR}
      merchant-id: ${P24_MERCHANT_ID:11111}
      api-key: ${P24_API_KEY:demo-simulator-api-key}
      crc-key: ${P24_CRC_KEY:demo-simulator-crc-key}

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
